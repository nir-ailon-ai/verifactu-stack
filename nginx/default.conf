server {
    listen 80;
    server_name _;
    client_max_body_size 200M;

    # Let's Encrypt HTTP-01 challenge path (used when you add a domain + TLS)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- Google sign-in gate, applies to everything below ---------------------
    # FacturaScripts still has its own separate login on top of this — this
    # gate runs first, so a visitor needs both a Google sign-in AND valid FS
    # credentials.

    location = /oauth2/auth {
        internal;
        proxy_pass         http://oauth2-proxy:4180;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-Uri   $request_uri;
        proxy_set_header   Content-Length    "";
        proxy_pass_request_body off;
    }

    location /oauth2/ {
        proxy_pass         http://oauth2-proxy:4180;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        auth_request       /oauth2/auth;
        error_page 401     = /oauth2/sign_in?rd=$scheme://$host$request_uri;

        auth_request_set $email $upstream_http_x_auth_request_email;
        proxy_set_header   X-Email           $email;

        proxy_pass         http://app:80;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
